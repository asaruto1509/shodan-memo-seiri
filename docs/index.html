  <style>
    :root{--ink:#11283d;--navy:#11324d;--blue:#08769b;--pale:#e8f3f5;--line:#cbd9df;--orange:#f08a3c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e9f3f5,#fff 48%,#edf2f6);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.75}header{background:var(--navy);color:#fff;padding:18px 0}.wrap{width:min(900px,calc(100% - 32px));margin:auto}.brand{font-weight:800}.hero{padding:64px 0 30px}.eyebrow{color:var(--blue);font-size:.85rem;font-weight:800;letter-spacing:.08em}.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.18;margin:8px 0 18px;letter-spacing:-.03em}.hero p{max-width:660px;color:#526574}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}.btn{display:inline-block;padding:12px 17px;border-radius:10px;text-decoration:none;font-weight:800}.primary{background:var(--orange);color:#22160d}.secondary{background:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:28px auto 60px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 12px 36px rgba(17,50,77,.08)}.card h2{margin:0 0 8px;font-size:1.2rem}.card p{margin:0;color:#526574}.steps{grid-column:1/-1}.steps ol{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0;list-style:none;counter-reset:s}.steps li{background:var(--pale);padding:16px;border-radius:10px}.steps li:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:28px;height:28px;margin-bottom:8px;border-radius:8px;background:var(--navy);color:#fff;font-weight:800}footer{text-align:center;padding:22px;color:#637280;font-size:.85rem}a:focus-visible{outline:3px solid #ffbd59;outline-offset:3px}@media(max-width:680px){.hero{padding-top:42px}.grid{grid-template-columns:1fr}.steps ol{grid-template-columns:1fr 1fr}}

<body>
  <header><div class="wrap brand">AI実用ラボ</div></header>

    <section class="hero"><p class="eyebrow">無料・Markdown形式</p><h1>商談メモを<br>提案書の骨子へ。</h1><p>課題、提案の方向、確認事項、次の行動を一枚で整理するテンプレートです。ダウンロードして、社内Wikiや普段のメモへそのまま貼り付けられます。</p><div class="actions"><a class="btn primary" href="https://github.com/asaruto1509/shodan-memo-seiri/raw/main/templates/shodan-memo-template.md">テンプレートをダウンロード</a><a class="btn secondary" href="https://shodan-memo-seiri.raitoninngu11111.chatgpt.site/?utm_source=github_pages&amp;utm_medium=referral&amp;utm_campaign=shodan_memo_template">ブラウザで整理する</a></div></section>
    <section class="grid"><article class="card"><h2>記録で終わらせない</h2><p>相手の発言と自社の提案を分け、次に確認することまで残せます。</p></article><article class="card"><h2>書式をそろえる</h2><p>担当者ごとに違う商談メモを、共通する4つの欄で整理できます。</p></article><article class="card steps"><h2>使い方</h2><ol><li>テンプレートを保存</li><li>個人情報を除く</li><li>4項目へ整理</li><li>骨子を確認</li></ol></article></section>
